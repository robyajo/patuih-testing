<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patuih Chat</title>
    
    <!-- Preconnect Google Fonts for instant premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Immediate styling fallback to prevent white flashes and unstyled text -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #080a10;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      
      /* Premium static loader */
      .initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #080a10;
        background-image: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15) 0%, rgba(8, 10, 16, 0) 60%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f3f4f6;
        z-index: 9999;
      }
      .initial-loader svg {
        width: 64px;
        height: 64px;
        color: #6366f1;
        filter: drop-shadow(0 4px 14px rgba(99, 102, 241, 0.4));
        animation: pulseLoader 2s infinite ease-in-out;
      }
      .initial-loader h2 {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 4px;
      }
      .initial-loader p {
        font-size: 13px;
        color: #6b7280;
        margin: 0;
      }
      @keyframes pulseLoader {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.06); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <h2>Patuih Chat</h2>
        <p>Connecting to gateway...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
